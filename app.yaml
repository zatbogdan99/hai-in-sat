# DEPLOY EXCLUSIV ÎN PROIECTUL `phrasal-period-415315`:
#   gcloud app deploy app.yaml --project=phrasal-period-415315
# (sau setezi gcloud config set project phrasal-period-415315 înainte de deploy)
# Acesta este proiectul la care e mapat domeniul `hai-în-sat.ro`.
runtime: nodejs22

instance_class: F2

entrypoint: node dist/hai-in-sat/server/main.js

# min_instances=0 (default automatic_scaling) — instanțele scalează la zero
# când nu există trafic. Cold start ~1-3s la primul request după idle.
automatic_scaling:
  min_instances: 0
  max_instances: 10

env_variables:
  BUCKET_NAME: "hai-in-sat-bucket"

handlers:
  # Asseturi statice — App Engine le servește direct fără să spună Node-ului.
  - url: /assets
    static_dir: dist/hai-in-sat/browser/assets
    secure: always

  - url: /robots.txt
    static_files: dist/hai-in-sat/browser/robots.txt
    upload: dist/hai-in-sat/browser/robots.txt
    secure: always

  - url: /sitemap.xml
    static_files: dist/hai-in-sat/browser/sitemap.xml
    upload: dist/hai-in-sat/browser/sitemap.xml
    secure: always

  - url: /favicon.ico
    static_files: dist/hai-in-sat/browser/favicon.ico
    upload: dist/hai-in-sat/browser/favicon.ico
    secure: always

  # Bundle-uri JS/CSS și alte fișiere fingerprint-uite — servite static.
  - url: /(.*\.(js|css|map|ico|png|jpg|jpeg|avif|svg|woff|woff2|ttf|eot|xml|txt|json))$
    static_files: dist/hai-in-sat/browser/\1
    upload: dist/hai-in-sat/browser/.*\.(js|css|map|ico|png|jpg|jpeg|avif|svg|woff|woff2|ttf|eot|xml|txt|json)$
    secure: always

  # Orice altă rută → server Node (Angular Universal SSR).
  - url: /.*
    script: auto
    secure: always
